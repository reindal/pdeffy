name: Build Electron App TEST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm install
        env:
          npm_config_build_from_source: false

      - name: Build Electron App
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/make/**/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List downloaded artifacts (debug)
        run: find installers -type f

      - name: Rename artifacts
        run: |
          mv $(find installers -name "*.exe") installers/pdeffy.exe
          mv $(find installers -name "*.deb") installers/pdeffy.deb
          mv $(find installers -name "*.dmg") installers/pdeffy.dmg

      - name: Upload to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo ${{ github.repository }} &>/dev/null; then
            gh release upload latest \
              --repo ${{ github.repository }} \
              --clobber \
              $(find installers -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \))
          else
            gh release create latest \
              --repo ${{ github.repository }} \
              --title "Latest Build" \
              --prerelease \
              --notes "Auto-updated on every push to main" \
              $(find installers -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \))
          fi

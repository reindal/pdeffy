name: Build Pdeffy App

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v2.*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tauriArgs: --features ai-metal
          - os: windows-latest
            tauriArgs: ""
          - os: ubuntu-latest
            tauriArgs: ""

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            cmake \
            build-essential \
            clang \
            libclang-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
        with:
          projectPath: .
          args: ${{ matrix.tauriArgs }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*
            !**/*.sig
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    # Publish only on semver tags (stable store URLs). No rolling "latest" overwrite.
    if: startsWith(github.ref, 'refs/tags/v2.')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List downloaded artifacts (debug)
        run: find installers -type f | head -100

      - name: Rename artifacts for store-style URLs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          mkdir -p named
          first() { find installers -type f "$@" 2>/dev/null | head -n1 || true; }
          EXE=$(first -iname '*.exe' ! -iname '*nupkg*')
          if [ -n "$EXE" ]; then cp "$EXE" "named/Pdeffy-${VERSION}-x64-setup.exe"; fi
          MSI=$(first -iname '*.msi')
          if [ -n "$MSI" ]; then cp "$MSI" "named/Pdeffy-${VERSION}-x64.msi"; fi
          DMG=$(first -iname '*.dmg')
          if [ -n "$DMG" ]; then cp "$DMG" "named/Pdeffy-${VERSION}-macos.dmg"; fi
          DEB=$(first -iname '*.deb')
          if [ -n "$DEB" ]; then cp "$DEB" "named/Pdeffy-${VERSION}-amd64.deb"; fi
          APPIMAGE=$(first -iname '*.AppImage')
          if [ -n "$APPIMAGE" ]; then cp "$APPIMAGE" "named/Pdeffy-${VERSION}-x86_64.AppImage"; fi
          RPM=$(first -iname '*.rpm')
          if [ -n "$RPM" ]; then cp "$RPM" "named/Pdeffy-${VERSION}-x86_64.rpm"; fi
          echo "Named assets:"
          ls -la named || true
          test -n "$(ls -A named 2>/dev/null)" || { echo "No installer assets to publish"; exit 1; }

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="$(cat <<EOF
          Pdeffy **${VERSION}** (Tauri 2.x).

          ## Downloads (stable URLs)

          | Platform | URL |
          |----------|-----|
          | Windows x64 (setup) | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-x64-setup.exe |
          | Windows x64 (MSI) | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-x64.msi |
          | macOS | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-macos.dmg |
          | Linux amd64 | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-amd64.deb |

          Source archives are attached automatically by GitHub.

          Frozen Electron 1.x: [v1.11.0-final](https://github.com/${{ github.repository }}/releases/tag/v1.11.0-final).  
          Naming conventions: [docs/releases.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/releases.md).
          EOF
          )"
          ASSETS=(named/*)
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${ASSETS[@]}"
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES" || true
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Pdeffy ${VERSION}" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi

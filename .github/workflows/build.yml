name: Build Electron App

on:
  push:
    branches:
      - main
      - release/1.x
    tags:
      - "v1.*"
  pull_request:
    branches:
      - main
      - release/1.x
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm install
        env:
          npm_config_build_from_source: false

      - name: Build Electron App
        run: npm run make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/make/**/*

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish on version tags (stable store URLs). Do not overwrite "latest" on every push.
    if: startsWith(github.ref, 'refs/tags/v1.')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List downloaded artifacts (debug)
        run: find installers -type f

      - name: Rename artifacts for store-style URLs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Tag v1.11.0-final → version string 1.11.0-final
          VERSION="${TAG#v}"
          mkdir -p named
          first() { find installers -type f "$@" 2>/dev/null | head -n1 || true; }
          # Windows: prefer Setup.exe / .exe; Electron Forge Squirrel typically produces .exe
          EXE=$(first -iname '*.exe' ! -iname '*nupkg*')
          if [ -n "$EXE" ]; then cp "$EXE" "named/Pdeffy-${VERSION}-x64-setup.exe"; fi
          MSI=$(first -iname '*.msi')
          if [ -n "$MSI" ]; then cp "$MSI" "named/Pdeffy-${VERSION}-x64.msi"; fi
          DMG=$(first -iname '*.dmg')
          if [ -n "$DMG" ]; then cp "$DMG" "named/Pdeffy-${VERSION}-macos.dmg"; fi
          DEB=$(first -iname '*.deb')
          if [ -n "$DEB" ]; then cp "$DEB" "named/Pdeffy-${VERSION}-amd64.deb"; fi
          APPIMAGE=$(first -iname '*.AppImage')
          if [ -n "$APPIMAGE" ]; then cp "$APPIMAGE" "named/Pdeffy-${VERSION}-x86_64.AppImage"; fi
          echo "Named assets:"
          ls -la named || true
          test -n "$(ls -A named 2>/dev/null)" || { echo "No installer assets to publish"; exit 1; }

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="$(cat <<EOF
          Final Electron **1.x** line for Pdeffy (${TAG}).

          ## Downloads (stable URLs)

          | Platform | URL |
          |----------|-----|
          | Windows x64 (setup) | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-x64-setup.exe |
          | macOS | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-macos.dmg |
          | Linux amd64 | https://github.com/${{ github.repository }}/releases/download/${TAG}/Pdeffy-${VERSION}-amd64.deb |

          Source archives are attached automatically by GitHub.

          See [docs/releases.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/releases.md) for naming conventions.
          EOF
          )"
          ASSETS=(named/*)
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${ASSETS[@]}"
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES" || true
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Pdeffy ${VERSION} (Electron final)" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi

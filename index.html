<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Converter</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Settings Icon -->

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>

<!-- Settings Modal -->
<div class="settingsModal" id="settingsModal">
    <div class="settingsContent">
        <h2 id="settingsTitle" class="langText">Settings</h2>
        <h3 id="metadataTitle" class="langText">PDF Metadata</h3>
        <div class="settingsFormGroup">
            <label for="metaAuthor" id="authorLabel" class="langText">Author:</label>
            <input type="text" id="metaAuthor" class="langTextPlaceholder" placeholder="Enter author name">
        </div>
        <div class="settingsFormGroup">
            <label for="metaTitle" id="titleLabel" class="langText">Title:</label>
            <input type="text" id="metaTitle" class="langTextPlaceholder" placeholder="Enter document title">
        </div>
        <div class="settingsFormGroup">
            <label for="metaSubject" id="subjectLabel" class="langText">Subject:</label>
            <input type="text" id="metaSubject" class="langTextPlaceholder" placeholder="Enter document subject">
        </div>
        <div class="settingsButtons">
            <button class="settingsBtn cancel" id="cancelSettingsBtn"><span class="langText" id="cancelSettings">Cancel</span></button>
            <button class="settingsBtn save" id="saveSettingsBtn"><span class="langText" id="saveSettings">Save Settings</span></button>
        </div>
        <div class="settingsStatus" id="settingsStatus"></div>
    </div>
</div>

<div class="headerContainer">
    <header>
        <img src="./assets/new_logo.png" alt="PDF Icon" class="headerIcon" style="cursor: pointer;">
        <h1 id="welcomeText" class="langText">Welcome to the PDF Converter</h1>
        <select id="languageSelector">
            <option value="en">🇬🇧 English</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pl">🇵🇱 Polski</option>
            <option value="es">🇪🇸 Español</option>
        </select>
    </header>
</div>
<main>
    <div class="optionContainer">
        <a href="./functionalities/split/split.html" class="optionCard" id="splitPDF">
            <img src="./assets/new2_split.png" alt="PDF Split Icon" class="optionIcon">
            <h2 id="splitPdfText" class="langText">Split PDF</h2>
            <p id="splitPdfDesc" class="langText">Split your PDF document into multiple files.</p>
        </a>
        <a href="./functionalities/merge/merge.html" class="optionCard" id="mergePDF">
            <img src="./assets/new2_merge.png" alt="PDF Merge Icon" class="optionIcon">
            <h2 id="mergePdfText" class="langText">Merge PDF</h2>
            <p id="mergePdfDesc" class="langText">Merge your PDF documents into single file.</p>
        </a>
    </div>
    <div class="optionContainer">
        <a href="./functionalities/imageToPdf/imageToPdf.html" class="optionCard" id="imageToPDF">
            <img src="./assets/new2_PicToPdf.png" alt="Image to PDF Icon" class="optionIcon">
            <h2 id="imageToPdfText" class="langText">Image to PDF</h2>
            <p id="imageToPdfDesc" class="langText">Convert one or more images into a PDF document.</p>
        </a>
        <a href="./functionalities/pdfToImage/pdfToImage.html" class="optionCard" id="pdfToImage">
            <img src="./assets/new2_PdfToPic.png" alt="PDF to Image Icon" class="optionIcon">
            <h2 id="pdfToImageText" class="langText">PDF to Image</h2>
            <p id="pdfToImageDesc" class="langText">Convert PDF pages into image files.</p>
        </a>
    </div>
</main>
<script src="./changeLang.js"></script>
<script src="./settings.js"></script>
</body>
</html>

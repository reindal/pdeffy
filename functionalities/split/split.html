<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Split PDF</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./split.css">
</head>
<body>
<div class="headerContainer">
    <header>
        <img src="../../assets/logo-nobg.png" alt="PDF Icon" class="headerIcon">
        <h1>Split PDF</h1>
    </header>
</div>

<main>
    <div class="splitContainer">
        <h1>Split PDF Document</h1>

        <form id="splitForm">
            <div class="formGroup">
                <label for="pdfFile">Select PDF file:</label>
                <div class="fileInputWrapper">
                    <input type="file" id="pdfFile" accept=".pdf" required>
                    <label for="pdfFile" class="fileInputLabel">Click to select file</label>
                </div>
                <div id="fileName" class="fileName"></div>
            </div>

            <div class="formGroup">
                <label>Split mode:</label>
                <div class="modeSelector">
                    <label class="modeOption">
                        <input type="radio" name="splitMode" value="range" checked>
                        <span>Custom Page Ranges</span>
                    </label>
                    <label class="modeOption">
                        <input type="radio" name="splitMode" value="every">
                        <span>Split Every X Pages</span>
                    </label>
                    <label class="modeOption">
                        <input type="radio" name="splitMode" value="custom">
                        <span>Custom Multi-Range Files</span>
                    </label>
                </div>
            </div>

            <div id="rangeModeContainer" class="modeContainer">
                <div class="formGroup">
                    <label>Select page ranges to extract:</label>
                    <div id="rangesContainer"></div>
                    <button type="button" id="addRangeBtn" class="addRangeBtn">+ Add Another Range</button>
                </div>
            </div>

            <!-- Every X Pages Mode -->
            <div id="everyModeContainer" class="modeContainer" style="display: none;">
                <div class="formGroup">
                    <label for="pagesInterval">Split every X pages:</label>
                    <input type="number" id="pagesInterval" min="1" value="10" placeholder="10">
                    <p class="helpText">PDF will be split into documents of this many pages each</p>
                </div>
            </div>

            <!-- Custom Multi-Range Files Mode -->
            <div id="customModeContainer" class="modeContainer" style="display: none;">
                <div class="formGroup">
                    <label>Define output files with multiple page ranges:</label>
                    <div id="customFilesContainer"></div>
                    <button type="button" id="addCustomFileBtn" class="addRangeBtn">+ Add Another Output File</button>
                    <p class="helpText">Each output file can contain multiple page ranges (e.g., pages 1-4 and 6-12 in one file)</p>
                </div>
            </div>

            <div class="formGroup">
                <label for="outputName">Output file name:</label>
                <input type="text" id="outputName" name="outputName" placeholder="document_name">
                <p class="helpText">Files will be named: name_1.pdf, name_2.pdf etc.</p>
            </div>

            <button type="submit" class="submitBtn" id="submitBtn">Split PDF</button>
        </form>

        <div id="status" class="status"></div>

        <a href="../../index.html" class="backLink">← Back to main page</a>
    </div>
</main>

<script src="./split.js"></script>
</body>
</html>

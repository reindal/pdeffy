<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PDF to Excel</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./pdfToExcel.css">
</head>

<body>
    <div class="headerContainer">
        <header>
            <img src="../../assets/pdeffy-flat-light.png" alt="PDF Icon" class="headerIcon">
            <h1 id="pdfToExcelHeader" class="langText">PDF to Excel</h1>
            <a href="../../index.html" class="backArrow" title="Back to main page">←</a>
        </header>
    </div>

    <main>
        <div class="pdfToExcelContainer">
            <h1 id="pdfToExcelHeader2" class="langText">Convert PDF to Excel</h1>

            <form id="pdfToExcelForm">
                <div class="formGroup">
                    <label for="pdfFile" id="pdfToExcelSelectLabel" class="langText">Select PDF file:</label>
                    <div class="fileInputWrapper">
                        <input type="file" id="pdfFile" accept=".pdf" required>
                        <label for="pdfFile" class="fileInputLabel langText" id="pdfToExcelSelectButton">Click to select file</label>
                    </div>
                    <div id="fileName" class="fileName"></div>
                </div>

                <button type="submit" class="submitBtn" id="submitBtn">
                    <span class="langText" id="pdfToExcelSubmitBtn">Convert to Excel</span>
                </button>
            </form>

            <div id="status" class="status"></div>

            <a href="../../index.html" class="backLink langText" id="backLink">← Back to main page</a>
        </div>
    </main>

    <script src="../../changeLang.js"></script>
    <script src="./../statusManager.js"></script>
    <script src="./../../settings.js"></script>
    <script src="./../customMetadata.js"></script>
    <script src="./../pdfEncryptionGuard.js"></script>
    <script src="./pdfToExcel.js"></script>
    <script src="../engineWarning.js"></script>
</body>

</html>

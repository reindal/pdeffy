<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Image</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./pdfToImage.css">
</head>
<body>
<div class="headerContainer">
    <header>
        <img src="../../assets/pdeffy-flat-light.png" alt="PDF Icon" class="headerIcon" style="cursor: pointer;">
        <h1 id="pdfToImageHeader" class="langText">PDF to Image</h1>
        <a href="../../index.html" class="backArrow" title="Back to main page">←</a>
    </header>
</div>

<main>
    <div class="pdfToImageContainer">
        <h1 id="pdfToImageHeader2" class="langText">Convert PDF to Images</h1>

        <form id="pdfToImageForm">
            <div class="formGroup">
                <label for="pdfFile" id="pdfToImageSelectLabel" class="langText">Select PDF file:</label>
                <div class="fileInputWrapper">
                    <input type="file" id="pdfFile" accept=".pdf" required>
                    <label for="pdfFile" class="fileInputLabel langText" id="pdfToImageSelectButton">Click to select PDF</label>
                </div>
                <div id="fileInfo" class="fileInfo"></div>
            </div>

            <div id="pagesPreview" class="pagesPreview" style="display: none;">
                <div class="previewHeader">
                    <h3 id="pagesPreviewTitle" class="langText">PDF Pages Preview</h3>
                    <button type="button" id="togglePreviewBtn" class="togglePreviewBtn">
                        <span id="togglePreviewText" class="langText">Hide preview</span>
                        <span id="togglePreviewIcon">▲</span>
                    </button>
                </div>
                <div id="pagesPreviewContainer"></div>
            </div>

            <div class="formGroup">
                <label for="imageFormat" id="pdfToImageFormatLabel" class="langText">Output image format:</label>
                <select id="imageFormat" name="imageFormat">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                </select>
            </div>

            <div class="formGroup">
                <label class="checkboxLabel">
                    <input type="checkbox" id="saveAsZipCheckbox" name="saveAsZip">
                    <span class="langText" id="saveAsZipLabel">Save as ZIP</span>
                </label>
            </div>

            <button type="submit" class="submitBtn" id="submitBtn"><span class="langText" id="pdfToImageSubmitBtn">Convert to Images</span></button>
        </form>

        <div id="status" class="status"></div>

        <a href="../../index.html" class="backLink langText" id="backLink">← Back to main page</a>
    </div>
</main>

<script type="module">
    // Load PDF.js from CDN and expose it globally
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
    window.pdfjsLib = pdfjsLib;
</script>

<script src="../../changeLang.js"></script>
<script src="./../../settings.js"></script>
<script src="./pdfToImage.js"></script>
</body>
</html>

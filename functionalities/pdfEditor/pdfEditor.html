<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica PDF — Pdeffy</title>
    <link rel="stylesheet" href="../../variables.css">
    <link rel="stylesheet" href="../../src/ui/shell.css">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./pdfEditor.css">
</head>

<body class="pdfEditorPage" data-nav="edit">
    <main class="pdfEditorContainer">
        <div id="pdfEditorDropZone" class="pdeffy-dropzone pdfEditorDropZone">
            <div class="pdeffy-dropzone-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            </div>
            <header class="pdeffy-page-header" style="margin-bottom:8px;text-align:center;width:100%;">
                <h1 style="justify-content:center;">
                    <span class="pdeffy-page-header-icon accent-pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg></span>
                    <span class="langText" id="pdfEditorTitle">Modifica PDF</span>
                </h1>
                <p class="langText" id="editHubSubtitle">Apri un PDF per modificarlo: aggiungi elementi, filigrana, censura e firma.</p>
            </header>
            <p id="pdfEditorDropHint" class="langText">Trascina un PDF qui o clicca per sfogliare</p>
            <input type="file" id="pdfEditorFileInput" accept=".pdf,application/pdf" hidden>
            <label for="pdfEditorFileInput" class="pdeffy-btn pdeffy-btn-primary langText" id="pdfEditorOpenPdf">Apri PDF</label>
            <p class="pdeffy-dropzone-hint langText" id="editSizeHint">Supporta file fino a 100 MB</p>
        </div>

        <div id="pdfEditorWorkspace" class="pdfEditorWorkspace">
            <div class="pdfEditorTopBar">
                <div class="pdfEditorTopBarLeft">
                    <a href="../../index.html" class="pdeffy-btn pdeffy-btn-ghost langText" id="pdfEditorBackHome">Torna alla Home</a>
                    <span id="pdfEditorFileName" class="fileName"></span>
                </div>
                <div class="pdfEditorTopBarActions">
                    <button type="button" id="pdfEditorChangeFile" class="pdeffy-btn pdeffy-btn-ghost langText">Cambia file</button>
                    <button type="button" id="pdfEditorExport" class="pdeffy-btn pdeffy-btn-primary langText" disabled>Esporta PDF</button>
                </div>
            </div>
            <div id="pdfEditorStatus" class="status pdfEditorStatusBar"></div>

            <div class="pdfEditorMain">
                <aside class="pdfEditorPagesPanel">
                    <h3 id="pdfEditorPagesPanel" class="langText">Pagine</h3>
                    <div id="pdfEditorThumbs" class="pdfEditorThumbsScroll"></div>
                </aside>

                <section class="pdfEditorPreviewPanel">
                    <div class="pdfEditorPreviewToolbar">
                        <button type="button" id="pdfEditorZoomOut" class="toolBtn" title="Zoom out" aria-label="Zoom out">−</button>
                        <span id="pdfEditorZoomLabel">100%</span>
                        <button type="button" id="pdfEditorZoomIn" class="toolBtn" title="Zoom in" aria-label="Zoom in">+</button>
                        <button type="button" id="pdfEditorZoomFit" class="toolBtn langText">Adatta larghezza</button>
                        <button type="button" id="pdfEditorViewSingle" class="toolBtn active langText">Pagina singola</button>
                        <button type="button" id="pdfEditorViewContinuous" class="toolBtn langText">Scorrimento continuo</button>
                        <button type="button" id="pdfEditorPrevPage" class="toolBtn pdfEditorNavBtn" title="Previous page" aria-label="Previous page">‹</button>
                        <button type="button" id="pdfEditorNextPage" class="toolBtn pdfEditorNavBtn" title="Next page" aria-label="Next page">›</button>
                        <span id="pdfEditorPageIndicator" class="pdfEditorPageIndicator">1 / 1</span>
                    </div>
                    <div id="pdfEditorViewerSingle" class="pdfEditorViewerSingle"></div>
                    <div id="pdfEditorViewerScroll" class="pdfEditorViewerScroll"></div>
                </section>

                <aside class="pdfEditorToolsPanel" id="pdfEditorToolsPanel">
                    <button type="button" class="pdfEditorPropsToggle" id="pdfEditorPropsToggle" aria-label="Collapse properties" title="Pannello">‹</button>
                    <div class="pdfEditorToolTabs">
                        <button type="button" class="pdfEditorToolTab langText" data-tool="search" id="pdfEditorToolSearch">Cerca</button>
                        <button type="button" class="pdfEditorToolTab active langText" data-tool="watermark" id="pdfEditorToolWatermark">Filigrana</button>
                        <button type="button" class="pdfEditorToolTab langText" data-tool="redact" id="pdfEditorToolRedact">Censura</button>
                        <button type="button" class="pdfEditorToolTab langText" data-tool="signature" id="pdfEditorToolSignature">Firma</button>
                    </div>
                    <div id="pdfEditorToolBody" class="pdfEditorToolBody"></div>
                </aside>
            </div>
        </div>
    </main>

    <script type="module" src="../../changeLang.js"></script>
    <script type="module" src="../statusManager.js"></script>
    <script type="module" src="../pdfEncryptionGuard.js"></script>
    <script type="module" src="../../settings.js"></script>
    <script type="module" src="../customMetadata.js"></script>
    <script type="module" src="/src/platform/pdfjs-setup.js"></script>
    <script type="module" src="./lib/coords.js"></script>
    <script type="module" src="./model/documentModel.js"></script>
    <script type="module" src="./export/applyAnnotations.js"></script>
    <script type="module" src="./export/flattenRedactions.js"></script>
    <script type="module" src="./export/buildPdf.js"></script>
    <script type="module" src="./view/pageThumbnails.js"></script>
    <script type="module" src="./view/pdfViewer.js"></script>
    <script type="module" src="./view/overlayManager.js"></script>
    <script type="module" src="./view/textSearch.js"></script>
    <script type="module" src="./tools/toolController.js"></script>
    <script type="module" src="./pdfEditor.js"></script>
    <script type="module" src="../../src/ui/shell.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizza PDF — Pdeffy</title>
    <link rel="stylesheet" href="../../variables.css">
    <link rel="stylesheet" href="../../src/ui/shell.css">
</head>
<body data-nav="organize">
    <header class="pdeffy-page-header">
        <h1>
            <span class="pdeffy-page-header-icon"><img src="../../assets/icons/svg/navigation/organize.svg" alt="" width="22" height="22"></span>
            <span class="langText" id="organizePdfSection">Organizza PDF</span>
        </h1>
        <p class="langText" id="organizeHubSubtitle">Unisci, dividi, proteggi e comprimi i tuoi documenti.</p>
    </header>

    <div class="pdeffy-search">
        <span class="pdeffy-search-icon"><img src="../../assets/icons/svg/actions/search.svg" alt="" aria-hidden="true"></span>
        <input type="search" id="organizeSearch" class="langTextPlaceholder" data-i18n="homeSearchPlaceholder" placeholder="Cerca uno strumento..." autocomplete="off">
    </div>

    <div class="pdeffy-tool-grid">
        <a class="pdeffy-tool-card" data-tool-card data-search="unisci merge" href="../merge/merge.html">
            <span class="pdeffy-tool-card-icon"><img src="../../assets/icons/svg/pdf-tools/merge-pdf.svg" alt=""></span>
            <span class="pdeffy-tool-card-body"><strong class="langText" id="mergePdfText">Unisci PDF</strong><span class="langText" id="mergePdfDesc">Unisci più PDF in un unico file</span></span>
            <span class="pdeffy-tool-card-arrow"><img src="../../assets/icons/svg/actions/arrow-right.svg" alt=""></span>
        </a>
        <a class="pdeffy-tool-card" data-tool-card data-search="dividi split" href="../split/split.html">
            <span class="pdeffy-tool-card-icon"><img src="../../assets/icons/svg/pdf-tools/split-pdf.svg" alt=""></span>
            <span class="pdeffy-tool-card-body"><strong class="langText" id="splitPdfText">Dividi PDF</strong><span class="langText" id="splitPdfDesc">Dividi un PDF in più file</span></span>
            <span class="pdeffy-tool-card-arrow"><img src="../../assets/icons/svg/actions/arrow-right.svg" alt=""></span>
        </a>
        <a class="pdeffy-tool-card" data-tool-card data-search="modello template" href="../pdfGenerator/pdfGenerator.html">
            <span class="pdeffy-tool-card-icon"><img src="../../assets/icons/svg/pdf-tools/template-pdf.svg" alt=""></span>
            <span class="pdeffy-tool-card-body"><strong class="langText" id="pdfByTemplateText">PDF da Modello</strong><span class="langText" id="pdfByTemplateDesc">Genera PDF da un modello</span></span>
            <span class="pdeffy-tool-card-arrow"><img src="../../assets/icons/svg/actions/arrow-right.svg" alt=""></span>
        </a>
        <a class="pdeffy-tool-card" data-tool-card data-search="proteggi protect" href="../protectPdf/protectPdf.html">
            <span class="pdeffy-tool-card-icon"><img src="../../assets/icons/svg/pdf-tools/shield.svg" alt=""></span>
            <span class="pdeffy-tool-card-body"><strong class="langText" id="protectPdfTile">Proteggi PDF</strong><span class="langText" id="protectPdfTileDesc">Password e permessi</span></span>
            <span class="pdeffy-tool-card-arrow"><img src="../../assets/icons/svg/actions/arrow-right.svg" alt=""></span>
        </a>
        <a class="pdeffy-tool-card" data-tool-card data-search="comprimi compress" href="../compressPdf/compressPdf.html">
            <span class="pdeffy-tool-card-icon"><img src="../../assets/icons/svg/pdf-tools/compress-pdf.svg" alt=""></span>
            <span class="pdeffy-tool-card-body"><strong class="langText" id="compressPdfTile">Comprimi PDF</strong><span class="langText" id="compressPdfTileDesc">Riduci le dimensioni del file</span></span>
            <span class="pdeffy-tool-card-arrow"><img src="../../assets/icons/svg/actions/arrow-right.svg" alt=""></span>
        </a>
    </div>

    <script type="module" src="../../src/ui/shell.js"></script>
    <script type="module" src="../../changeLang.js"></script>
    <script type="module" src="../../settings.js"></script>
    <script type="module">
        import { wireHomeSearch } from '../../src/ui/shell.js';
        wireHomeSearch(document.getElementById('organizeSearch'));
    </script>
</body>
</html>

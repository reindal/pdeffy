[package]
name = "pdeffy"
version = "2.0.0"
description = "Application for manipulating PDF files"
authors = ["Reindal"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pdeffy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

lopdf = "0.34"
pdf-extract = "0.8"
rust_xlsxwriter = "0.79"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Local AI (llama.cpp in-process) — enabled by default via feature `ai`
llama-cpp-2 = { version = "0.1.157", optional = true, default-features = false }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls", "stream"] }
encoding_rs = { version = "0.8", optional = true }
rapidocr-core = { version = "0.2.2", features = ["model-download"], optional = true }
ort = { version = "2.0.0-rc.9", optional = true, default-features = false, features = ["download-binaries"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
office2pdf = "0.8.0"
tauri-plugin-single-instance = "2"
docx-rs = "0.4"
pdfium-render = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "objc2-app-kit"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[features]
default = ["ai"]
updater = ["dep:tauri-plugin-updater"]
ai = ["dep:llama-cpp-2", "dep:reqwest", "dep:encoding_rs", "dep:rapidocr-core", "ner-onnx"]
ner-onnx = ["dep:ort", "dep:tokenizers"]
pdf-layout = ["dep:pdfium-render"]
ai-metal = ["ai", "llama-cpp-2/metal"]
ai-cuda = ["ai", "llama-cpp-2/cuda"]
ai-vulkan = ["ai", "llama-cpp-2/vulkan"]
